[package]
name = "netcat"
version = "0.5.0"
description = "Local HTTP/HTTPS capture and mock proxy"
authors = ["kaite han"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "netcat_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "netcat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "0.22"
brotli = "9"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
flate2 = "1"
futures-util = "0.3"
http-body-util = "0.1"
hudsucker = "0.24.1"
keyring = { version = "3.6.3", features = ["apple-native"] }
local-ip-address = "0.6"
regex = "1.11"
rquickjs = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.11.6", features = ["devtools"] }
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-dialog = "=2.6.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net"] }
tracing = "0.1"
url = "2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
x509-parser = "0.18"

[dev-dependencies]
tempfile = "3.15"

[target.'cfg(target_os = "windows")'.dependencies]
tempfile = "3.15"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Networking_WinInet", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
tempfile = "3.15"
